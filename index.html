<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="野生のプログラマZが個人で作っているiPhone・iPadアプリの一覧です。写真で遊ぶゲームから、勉強・読書・ちょっと便利な道具まで。">
<meta name="theme-color" content="#eef3ff">
<title>野生のプログラマZ</title>
<style>
  :root {
    /* 詳細ページと同じ、太い線とずらした影のポップな作り */
    --bg: #eef3ff;
    --dot: #d5def7;
    --ink: #1e1b3a;
    --muted: #5b5878;
    --paper: #ffffff;
    --accent: #ff5a5f;
    --gold: #ffc93d;
    --line: 3px solid var(--ink);
    --pop: 5px 5px 0 var(--ink);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px);
    background-size: 22px 22px;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  img { display: block; max-width: 100%; }
  h1, h2, h3 { word-break: keep-all; overflow-wrap: anywhere; }
  .wrap { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }

  /* ヒーロー：アプリのアイコンをステッカーのように貼る */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: clamp(28px, 5vw, 64px);
    align-items: center;
    padding: clamp(40px, 7vw, 88px) 0 clamp(36px, 5vw, 56px);
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(2.6rem, 6.4vw, 4.8rem);
    line-height: 1.12;
    font-weight: 900;
    letter-spacing: -.02em;
    color: var(--ink);
    text-shadow: 4px 4px 0 var(--accent);
  }
  .hero p {
    max-width: 30em;
    margin: 22px 0 0;
    font-size: clamp(1rem, 1.7vw, 1.12rem);
    font-weight: 600;
    color: var(--muted);
  }
  .hero-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 18px;
    border: var(--line);
    border-radius: 999px;
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink);
    text-decoration: none;
    font-weight: 800;
    font-size: .92rem;
  }
  .pill.primary { background: var(--gold); }

  .stickers {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(8px, 1.4vw, 16px);
    padding: clamp(10px, 2vw, 20px);
  }
  .stickers a {
    display: block;
    aspect-ratio: 1;
    border: 3px solid var(--ink);
    border-radius: 24%;
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink);
    overflow: hidden;
    rotate: var(--tilt, 0deg);
    transition: rotate .15s ease, scale .15s ease;
    animation: stick .45s cubic-bezier(.3, 1.6, .5, 1) both;
    animation-delay: calc(var(--i) * 45ms);
  }
  .stickers a:hover { rotate: 0deg; scale: 1.08; }
  .stickers img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes stick { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }

  /* カテゴリの絞り込み */
  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 14px 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 6px 14px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: .86rem;
    font-weight: 800;
    cursor: pointer;
  }
  .chip span { margin-left: 4px; color: var(--muted); font-weight: 700; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip[aria-pressed="true"] span { color: var(--gold); }

  main { padding-bottom: 72px; }
  .block { margin-top: 44px; }
  .block h2 { margin: 0 0 18px; font-size: clamp(1.4rem, 3vw, 1.9rem); }
  .block h2 small { margin-left: 8px; font-size: .9rem; color: var(--muted); }

  /* 新作は大きく */
  .featured { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .feature {
    display: flex;
    flex-direction: column;
    border: var(--line);
    border-radius: 26px;
    background: var(--paper);
    box-shadow: 6px 6px 0 var(--ink);
    overflow: hidden;
  }
  .feature-top {
    display: grid;
    place-items: center;
    padding: 30px 0 26px;
    border-bottom: var(--line);
    background-color: var(--tint);
    background-image: radial-gradient(rgba(255,255,255,.35) 20%, transparent 22%);
    background-size: 26px 26px;
  }
  .feature-top img {
    width: 112px;
    height: 112px;
    border: var(--line);
    border-radius: 26px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .feature-body { display: flex; flex-direction: column; flex: 1; padding: 18px 20px 20px; }
  .feature h3 { margin: 6px 0 4px; font-size: 1.3rem; }
  .feature p { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }

  /* すべてのアプリ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 4px 16px;
    padding: 18px;
    border: var(--line);
    border-radius: 22px;
    background: var(--paper);
    grid-template-rows: 1fr auto;
    box-shadow: var(--pop);
  }
  .card > img { width: 76px; height: 76px; border: 2px solid var(--ink); border-radius: 18px; }
  .card h3 { margin: 4px 0 2px; font-size: 1.08rem; line-height: 1.4; }
  .card p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.6; }
  .card .buttons { grid-column: 1 / -1; align-self: end; margin-top: 12px; }

  .category {
    display: inline-block;
    align-self: flex-start;
    padding: 0 10px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--tint);
    font-size: .74rem;
    font-weight: 800;
  }
  .buttons { display: flex; gap: 10px; margin-top: auto; }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    font-weight: 800;
    font-size: .88rem;
    background: var(--paper);
  }
  .btn.store { background: var(--ink); color: var(--paper); }
  .btn:hover { background: var(--gold); color: var(--ink); }
  .empty { margin: 0; padding: 28px; border: 2px dashed var(--muted); border-radius: 22px; text-align: center; font-weight: 700; color: var(--muted); }

  footer { padding: 32px 0 48px; border-top: var(--line); background: var(--paper); font-size: .9rem; }
  .footer-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; }
  .footer-row nav { display: flex; flex-wrap: wrap; gap: 20px; font-weight: 800; }
  footer a { text-underline-offset: 4px; }
  footer small { color: var(--muted); }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .featured { grid-template-columns: 1fr; }
    .feature { flex-direction: row; }
    .feature-top { padding: 0 22px; border-bottom: 0; border-right: var(--line); }
    .feature-top img { width: 84px; height: 84px; border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .wrap { width: calc(100% - 28px); }
    .grid { grid-template-columns: 1fr; }
    .feature { flex-direction: column; }
    .feature-top { padding: 22px 0; border-right: 0; border-bottom: var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stickers a { animation: none; transition: none; }
  }
</style>
</head>
<body>
<header class="hero wrap">
  <div>
    <h1>野生の<br>プログラマZ</h1>
    <p id="intro">ひとりで作っているiPhone・iPadアプリ。写真で遊ぶゲームから、勉強・読書・ちょっと便利な道具まで。</p>
    <div class="hero-links">
      <a class="pill primary" href="#apps">アプリを見る</a>
      <a class="pill" href="https://twitter.com/u11238123" target="_blank" rel="noopener">TwitterのDMで問い合わせ</a>
    </div>
  </div>
  <div class="stickers" id="stickers" aria-label="アプリのアイコン一覧"></div>
</header>

<div class="filters">
  <div class="wrap filter-row" id="filters" role="group" aria-label="カテゴリで絞り込む"></div>
</div>

<main class="wrap" id="apps">
  <section class="block" id="newBlock">
    <h2>新しいアプリ</h2>
    <div class="featured" id="featured"></div>
  </section>
  <section class="block">
    <h2 id="allHeading">すべてのアプリ</h2>
    <div class="grid" id="appsGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    <nav>
      <a href="https://twitter.com/u11238123" target="_blank" rel="noopener">お問い合わせ（TwitterのDM）</a>
      <a href="privacy.html" target="_blank">プライバシーポリシー</a>
    </nav>
    <small>このページは App Store のデベロッパーページをもとに作成されています。</small>
  </div>
</footer>

<script>
// 新しい順に並べる。先頭の3本を「新しいアプリ」として大きく出す
const apps = [
  { name:'フォトブレード', url:'https://apps.apple.com/jp/app/id6824405332', desc:'写真から切り抜いた被写体が回転するバトルコマになる、3D物理バトルゲームです', category:'ゲーム', image:'image/icon/photoBlade.png', page:'detail/photoBlade.html' },
  { name:'青空ずんだ', url:'https://apps.apple.com/jp/app/id6824322042', desc:'ずんだもんと図書館を歩いて、青空文庫の名作を探して読める読書アプリです。ずんだもんの声で読み上げもできます', category:'ブック', image:'image/icon/aozoraZunda.png', page:'detail/aozoraZunda.html' },
  { name:'のっけタワー', url:'https://apps.apple.com/jp/app/id6822193103', desc:'写真から切り抜いた被写体を積み上げて、どこまで高く積めるかチャレンジするタワーゲームです', category:'ゲーム', image:'image/icon/imageTower.png', page:'detail/imageTower.html' },
  { name:'くっつけ', url:'https://apps.apple.com/jp/app/id6820843882', desc:'じぶんの写真を切り抜いて遊ぶ、写真がくっついて進化する落ちものパズルです', category:'ゲーム', image:'image/icon/kuttuke.png', page:'detail/kuttuke.html' },
  { name:'タンゴミル', url:'https://apps.apple.com/jp/app/id6818413919', desc:'英文を貼るだけで、自分だけの単語帳と4択クイズが作れるアプリです', category:'教育', image:'image/icon/tangomiru.png', page:'detail/tangomiru.html' },
  { name:'酒田道場', url:'https://apps.apple.com/jp/app/id6798115410', desc:'実例チャートでローソク足30パターンをクイズと図鑑で学べるアプリです', category:'教育', image:'image/icon/sakataDojo.png', page:'detail/sakataDojo.html' },
  { name:'かぶ戦記', url:'https://apps.apple.com/jp/app/id6752121856', desc:'株のトレードで戦った記録を感情やメモとともに記録するアプリです', category:'ファイナンス', image:'image/icon/kabusenki.png', page:'detail/kabusenki.html' },
  { name:'AI俳句バトル', url:'https://apps.apple.com/jp/app/id6753979897', desc:'「AI俳句バトル」は、日本の伝統文化である俳句と、最新のAI技術を融合させた新感覚の言葉遊びアプリです。', category:'エンターテインメント', image:'image/icon/aiHaikuBattle.png', page:'detail/AIHaikuBattle.html' },
  { name:'ぺろのーむ', url:'https://apps.apple.com/jp/app/id1454250247', desc:'振り子の動作をアメを舐める動きで表現したメトロノームアプリです。', category:'ミュージック', image:'image/icon/peronome.png', page:'detail/peronome.html' },
  { name:'oh!natto', url:'https://apps.apple.com/jp/app/id1457049172', desc:'Oh!Natto!は納豆アクションゲームです。たくさん混ぜて時間内にたくさん食べよう', category:'ゲーム', image:'image/icon/mame.png', page:'https://inouefood.github.io/inouefood/natto.html' },
  { name:'まんがのしおり', url:'https://apps.apple.com/jp/app/id6469087739', desc:'たくさんの漫画を読んでいると何巻まで、何話まで読んだかわからなくなる瞬間ありませんか？', category:'ユーティリティ', image:'image/icon/DigitalBookmark.png', page:'detail/digiralBookmark.html' },
  { name:'アニメ手帳', url:'https://apps.apple.com/jp/app/id1556976347', desc:'今期視聴しているアニメを一括管理できるアプリ、見ているサイトに直接飛べる！', category:'エンターテインメント', image:'image/icon/animeSchedule.png', page:'https://animeschedule-23f6d.web.app/' },
  { name:'だれのあし', url:'https://apps.apple.com/jp/app/1465352189', desc:'いろんな足を見て一体それは誰の足なのかを当てるクイズゲームです、わかるかな？', category:'ゲーム', image:'image/icon/whoLeg.png', page:'detail/whoLeg.html' },
  { name:'えびフライ', url:'https://apps.apple.com/jp/app//id1461666071', desc:'🍤を空に飛ばす、ただそれだけのゲーム。意外とハマってしまうかも？', category:'ゲーム', image:'image/icon/ebiFly.png', page:'detail/ebiFly.html' },
  { name:'Kodo-心臓博物館', url:'https://apps.apple.com/jp/app/6444230294', desc:'心臓の鼓動は生き物によって速さが違う、みんなの生きる速さを手の中で感じてください', category:'教育', image:'image/icon/kodo.png', page:'detail/kodo.html' },
  { name:'たぷれこ', url:'https://apps.apple.com/jp/app/id6443822117', desc:'パワハラが横行する現代社会でいつでもワンタップで録音ができる防犯アプリ', category:'仕事効率化', image:'image/icon/tapreco.png', page:'detail/tapreco.html' },
  { name:'toio コントローラアプリ', url:'https://apps.apple.com/jp/app/id1469030441', desc:'toio 用コントローラ、ゲームソフトがなくてもtoioを操作してラジコンのように楽しめます', category:'エンターテインメント', image:'image/icon/toioController.png', page:'detail/toioController.html' },
  { name:'Switchキャプチャ', url:'https://apps.apple.com/jp/app/id6471073089', desc:'Switchのキャプチャを扱うユーティリティ、iPadでゲームを楽しめます', category:'ユーティリティ', image:'image/icon/switch-svc-icon-deleteAlpha.png', page:'detail/SwitchCapture.html' }
];

// カテゴリごとの色（バッジと新作カードの背景）
const tints = {
  'ゲーム':'#ff8a80', 'ブック':'#a5dc7a', '教育':'#7fd8b0', 'ファイナンス':'#ffd166',
  'エンターテインメント':'#c7a6ff', 'ミュージック':'#ffa8d8', 'ユーティリティ':'#8fb8ff', '仕事効率化':'#8fdcf0'
};
const tintOf = app => tints[app.category] || '#e2e8f0';
const tilts = [-6, 4, -2, 7, -5, 3, 6, -4, 2, -7, 5, -3];

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach(child => node.append(child));
  return node;
}

function buttons(app) {
  const detail = el('a', { className:'btn', href:app.page, textContent:'詳細を見る' });
  const store = el('a', { className:'btn store', href:app.url, target:'_blank', rel:'noopener', textContent:'App Store' });
  return el('div', { className:'buttons' }, [detail, store]);
}

function category(app) {
  const badge = el('span', { className:'category', textContent:app.category });
  badge.style.setProperty('--tint', tintOf(app));
  return badge;
}

// ヒーローのステッカー
const stickers = document.getElementById('stickers');
apps.forEach((app, i) => {
  const link = el('a', { href:app.page, title:app.name }, [el('img', { src:app.image, alt:app.name, width:120, height:120 })]);
  link.style.setProperty('--tilt', tilts[i % tilts.length] + 'deg');
  link.style.setProperty('--i', i);
  stickers.append(link);
});

// 新しいアプリ
const featured = document.getElementById('featured');
apps.slice(0, 3).forEach(app => {
  const top = el('div', { className:'feature-top' }, [el('img', { src:app.image, alt:'', width:112, height:112 })]);
  top.style.setProperty('--tint', tintOf(app));
  const body = el('div', { className:'feature-body' }, [
    category(app),
    el('h3', { textContent:app.name }),
    el('p', { textContent:app.desc }),
    buttons(app)
  ]);
  featured.append(el('article', { className:'feature' }, [top, body]));
});

// すべてのアプリ（カテゴリで絞り込み）
const grid = document.getElementById('appsGrid');
const allHeading = document.getElementById('allHeading');
const newBlock = document.getElementById('newBlock');

function render(selected) {
  const list = selected ? apps.filter(app => app.category === selected) : apps;
  newBlock.hidden = Boolean(selected);
  allHeading.replaceChildren(selected ? selected + 'のアプリ' : 'すべてのアプリ', el('small', { textContent:list.length + '本' }));
  grid.replaceChildren(...list.map(app => el('article', { className:'card' }, [
    el('img', { src:app.image, alt:'', width:76, height:76, loading:'lazy' }),
    el('div', {}, [category(app), el('h3', { textContent:app.name }), el('p', { textContent:app.desc })]),
    buttons(app)
  ])));
}

const filters = document.getElementById('filters');
const counts = apps.reduce((map, app) => map.set(app.category, (map.get(app.category) || 0) + 1), new Map());
const options = [[null, 'すべて', apps.length], ...[...counts].sort((a, b) => b[1] - a[1]).map(([name, n]) => [name, name, n])];
options.forEach(([value, label, n]) => {
  const chip = el('button', { type:'button', className:'chip' }, [label, el('span', { textContent:n })]);
  chip.setAttribute('aria-pressed', String(value === null));
  chip.addEventListener('click', () => {
    filters.querySelectorAll('.chip').forEach(other => other.setAttribute('aria-pressed', String(other === chip)));
    render(value);
  });
  filters.append(chip);
});

render(null);
</script>
</body>
</html>
