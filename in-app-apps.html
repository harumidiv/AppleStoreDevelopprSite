<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="野生のプログラマZのアプリ一覧（アプリ内表示用）">
<title>関連アプリ</title>
<!--
  アプリ内の WebView で表示するための一覧ページ。データは apps-data.js、翻訳は site-i18n/index/<言語>.js を使う。
    ?lang=en           表示言語（lang.js の仕組みのまま）
    ?exclude=1469030441 表示しない App Store ID（カンマ区切りで複数可）。表示中のアプリ自身を外すのに使う
  App Store へのリンクは target="_blank" にしてあり、アプリ側で App Store を開く
-->
<style>
  :root {
    --bg: #eef3ff;
    --ink: #1e1b3a;
    --muted: #5b5878;
    --paper: #ffffff;
    --gold: #ffc93d;
    --gutter: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding:
      var(--gutter)
      max(var(--gutter), env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(var(--gutter), env(safe-area-inset-left));
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  /* 言語はアプリから ?lang= で渡すので、切り替えのプルダウンは出さない */
  .site-lang { display: none !important; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .card {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    height: 100%;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    border-radius: 18px;
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink);
    color: inherit;
    text-decoration: none;
    transition: translate .08s ease, box-shadow .08s ease;
  }
  .card:active { translate: 2px 2px; box-shadow: 1px 1px 0 var(--ink); }
  .card img {
    width: 64px;
    height: 64px;
    border: 2px solid var(--ink);
    border-radius: 15px;
  }
  .card h2 {
    margin: 0;
    font-size: 1rem;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .category {
    display: inline-block;
    margin-bottom: 3px;
    padding: 0 8px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--tint);
    font-size: .68rem;
    font-weight: 800;
  }
  .card p {
    display: -webkit-box;
    margin: 2px 0 0;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    color: var(--muted);
    font-size: .8rem;
  }
  .get {
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-size: .78rem;
    font-weight: 800;
    white-space: nowrap;
  }
</style>
<script src="site-i18n/lang.js" data-page="index" data-mode="dict" defer></script>
</head>
<body>
<ul class="grid" id="apps"></ul>

<script src="apps-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const excluded = new Set((params.get('exclude') || '').split(',').map(s => s.trim()).filter(Boolean));
const storeId = app => (app.url.match(/(\d+)\/?$/) || [])[1];
const apps = window.SITE_APPS.filter(app => !excluded.has(storeId(app)));
const tintOf = app => window.SITE_TINTS[app.category] || '#e2e8f0';

// 表示中の言語の翻訳（日本語のときは null）
let t = null;
const nameOf = app => (t && t.apps[app.name] && t.apps[app.name].name) || app.name;
const descOf = app => (t && t.apps[app.name] && t.apps[app.name].desc) || app.desc;
const categoryOf = name => (t && t.categories[name]) || name;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach(child => node.append(child));
  return node;
}

const list = document.getElementById('apps');
function render() {
  list.replaceChildren(...apps.map(app => {
    const badge = el('span', { className:'category', textContent:categoryOf(app.category) });
    badge.style.setProperty('--tint', tintOf(app));
    const link = el('a', { className:'card', href:app.url, target:'_blank', rel:'noopener' }, [
      el('img', { src:app.image, alt:'', width:64, height:64, loading:'lazy' }),
      el('div', {}, [badge, el('h2', { textContent:nameOf(app) }), el('p', { textContent:descOf(app) })]),
      el('span', { className:'get', textContent:'App Store', ariaHidden:'true' })
    ]);
    link.setAttribute('aria-label', nameOf(app) + ' App Store');
    return el('li', {}, [link]);
  }));
}
render();

document.addEventListener('sitelangchange', e => {
  t = e.detail.t;
  render();
});
</script>
</body>
</html>
